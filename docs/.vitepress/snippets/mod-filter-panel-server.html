<div class="demo-form">
  <label>Unit
    <select id="mod-fp-unit">
      <option value="">All units</option>
      <option>S.T.A.R.S. Alpha</option>
      <option>S.T.A.R.S. Bravo</option>
      <option>R.P.D.</option>
      <option>Umbrella Corp.</option>
      <option>B.S.A.A.</option>
      <option>U.B.C.S.</option>
    </select>
  </label>
  <label>Status
    <select id="mod-fp-status">
      <option value="">Any status</option>
      <option value="open">Open</option>
      <option value="pending">Pending</option>
      <option value="done">Done</option>
      <option value="cancelled">Cancelled</option>
      <option value="draft">Draft</option>
    </select>
  </label>
  <label>Name contains
    <input id="mod-fp-name" type="search" placeholder="e.g. Kennedy">
  </label>
  <label class="inline"><input id="mod-fp-rc" type="checkbox"> Raccoon City only</label>
  <button type="button" id="mod-fp-reset">Reset</button>
</div>
<table id="mod-filter-panel-server"></table>
