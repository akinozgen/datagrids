<form class="demo-form" onsubmit="return false">
  <label>--dg-accent <input type="color" id="guide-theme-accent" value="#3d63dd"></label>
  <label>density
    <select id="guide-theme-density"><option>compact</option><option selected>normal</option><option>comfortable</option></select>
  </label>
  <label>size
    <select id="guide-theme-size"><option>sm</option><option selected>md</option><option>lg</option></select>
  </label>
  <label>head
    <select id="guide-theme-head"><option selected>caps</option><option>sentence</option></select>
  </label>
  <label>theme
    <select id="guide-theme-theme"><option value="" selected>follow the page</option><option>light</option><option>dark</option></select>
  </label>
</form>
<div id="guide-theme-host">
  <table id="guide-theme"></table>
</div>
